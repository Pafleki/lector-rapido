<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Lecteur rapide d’e-mails</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--text:#f5f5f7;--muted:#a8abb4;--accent:#8ab4ff;--line:#353841}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:13px;padding:12px 15px;background:var(--panel);color:var(--text);font-weight:600}button:active{transform:scale(.98)}button.primary{background:var(--accent);color:#101114;border-color:var(--accent)}button:disabled{opacity:.35;cursor:default}header{padding:calc(14px + env(safe-area-inset-top)) 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:900px;margin:auto}h1{font-size:19px;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:13px}.wrap{max-width:900px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}textarea{width:100%;min-height:170px;resize:vertical;background:#111216;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:13px;line-height:1.5}textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.setting{min-width:0}.setting strong{color:var(--text)}input[type=range]{width:100%;accent-color:var(--accent)}.reader{min-height:270px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}.guide{position:absolute;top:50%;left:9%;right:9%;height:1px;background:#343740;opacity:.65}.word{position:relative;font-size:clamp(34px,8vw,68px);font-weight:650;letter-spacing:-1.5px;line-height:1.15;overflow-wrap:anywhere;max-width:100%;padding:12px 0}.counter{font-size:13px;color:var(--muted);margin-top:12px}.progress{height:5px;border-radius:99px;background:#343740;overflow:hidden;margin:15px 0 10px}.progress>div{height:100%;width:0;background:var(--accent);transition:width .1s linear}.controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.controls button{padding:13px 4px}.hint{color:var(--muted);font-size:12px;line-height:1.45;margin:10px 2px 0}.hidden{display:none!important}.light{--bg:#f4f5f8;--panel:#fff;--text:#18191c;--muted:#626772;--accent:#245fca;--line:#d8dbe2;color-scheme:light}.light textarea{background:#fafbfc}.light .guide{background:#d5d8df}.light .progress,.light .progress>div{ }@media(max-width:420px){.controls{grid-template-columns:repeat(3,minmax(0,1fr))}.controls button:last-child{grid-column:span 2}.settings{grid-template-columns:1fr 1fr}.card{padding:13px}.reader{min-height:240px}}
</style>
</head>
<body>
<header><div><h1>Lecteur rapide</h1><p>Lisez vos e-mails un mot à la fois.</p></div><button id="themeBtn" aria-label="Changer de thème">☼ Thème</button></header>
<main class="wrap">
<section id="inputCard" class="card">
<label for="source">Collez le texte à lire ici</label>
<textarea id="source" placeholder="Ouvrez votre e-mail, copiez le texte et collez-le ici…"></textarea>
<div class="settings">
 <div class="setting"><label for="speed">Vitesse : <strong><span id="speedVal">300</span> mots/min</strong></label><input id="speed" type="range" min="100" max="800" step="25" value="300"></div>
 <div class="setting"><label for="size">Taille des mots : <strong><span id="sizeVal">56</span> px</strong></label><input id="size" type="range" min="32" max="84" step="2" value="56"></div>
</div>
<div class="row" style="margin-top:14px"><button class="primary" id="startBtn">Commencer la lecture</button><button id="clearBtn">Effacer le texte</button></div>
<p class="hint">Le texte est traité sur cet appareil et n’est envoyé à aucun serveur.</p>
</section>
<section class="card">
<div class="reader" aria-live="polite"><div class="guide"></div><div id="word" class="word">Votre texte apparaîtra ici</div><div id="counter" class="counter">0 mot sur 0</div></div>
<div class="progress"><div id="progressFill"></div></div>
<div class="controls">
<button id="backBtn" title="Mot précédent">−1</button><button id="restartBtn" title="Recommencer depuis le début">↺ Début</button><button class="primary" id="playBtn">▶ Lire</button><button id="nextBtn" title="Mot suivant">+1</button><button id="editBtn">Modifier le texte</button>
</div>
<p class="hint">Conseil : commencez à 200–300 mots/min, puis augmentez progressivement si vous comprenez toujours le texte.</p>
</section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);let words=[],index=0,timer=null,playing=false;
const source=$('source'),word=$('word'),counter=$('counter'),fill=$('progressFill'),speed=$('speed');
function parseText(s){return s.replace(/\r/g,' ').replace(/[\t ]+/g,' ').replace(/\n{3,}/g,'\n\n').trim().split(/\s+/).filter(Boolean)}
function delayFor(w){let base=60000/Number(speed.value);if(/[.!?…]$/.test(w))base*=1.85;else if(/[,;:]$/.test(w))base*=1.35;if(w.length>=10)base*=1.12;return base}
function render(){if(!words.length){word.textContent='Votre texte apparaîtra ici';counter.textContent='0 mot sur 0';fill.style.width='0%';return}word.textContent=words[Math.min(index,words.length-1)];counter.textContent=`${Math.min(index+1,words.length)} sur ${words.length} mots · ${Math.round(index/Math.max(words.length,1)*100)} %`;fill.style.width=`${Math.min(100,(index+1)/words.length*100)}%`}
function stop(){playing=false;if(timer){clearTimeout(timer);timer=null}$('playBtn').textContent='▶ Lire'}
function tick(){if(!playing)return;if(index>=words.length-1){render();stop();return}index++;render();timer=setTimeout(tick,delayFor(words[index]||''))}
function play(){if(!words.length){load();if(!words.length)return}if(index>=words.length-1)index=0;playing=true;$('playBtn').textContent='Ⅱ Pause';timer=setTimeout(tick,delayFor(words[index]||''))}
function load(){stop();words=parseText(source.value);index=0;render();if(words.length){$('inputCard').classList.add('hidden');$('playBtn').textContent='▶ Lire'}}
$('startBtn').addEventListener('click',load);$('clearBtn').addEventListener('click',()=>{stop();source.value='';words=[];index=0;render()});$('playBtn').addEventListener('click',()=>playing?stop():play());$('backBtn').addEventListener('click',()=>{stop();index=Math.max(0,index-1);render()});$('nextBtn').addEventListener('click',()=>{stop();index=Math.min(Math.max(words.length-1,0),index+1);render()});$('restartBtn').addEventListener('click',()=>{stop();index=0;render()});$('editBtn').addEventListener('click',()=>{stop();$('inputCard').classList.remove('hidden');source.focus()});speed.addEventListener('input',()=>{$('speedVal').textContent=speed.value});$('size').addEventListener('input',e=>{word.style.fontSize=e.target.value+'px';$('sizeVal').textContent=e.target.value});$('themeBtn').addEventListener('click',()=>document.body.classList.toggle('light'));
document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input,select'))return;if(e.code==='Space'){e.preventDefault();playing?stop():play()}else if(e.key==='ArrowRight'){$('nextBtn').click()}else if(e.key==='ArrowLeft'){$('backBtn').click()}else if(e.key==='Escape')stop()});
try{const params=new URLSearchParams(location.search);const incoming=params.get('text');if(incoming){source.value=incoming;load();history.replaceState({},'',location.pathname)}}catch(e){}
})();
</script>
</body>
</html>
